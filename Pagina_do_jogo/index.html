<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batalha naval</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
  <audio id="som" src="Som/piratesom.mp3"></audio>

    <div class="pagina-container">
      <button id="btnAbrirMenu" class="btnAbrirMenu">
        <img src="img/menu.png" alt="Menu" />
      </button>

      <main id="area-jogo" class="area-jogo">
        <div id="tabuleiro-jogo" class="tabuleiro-jogo">

        </div>
        <section id="informacoes-jogo" class="informacoes-jogo">
          <div class="informacoes" id="informacoes">
            <p id="tempo">Tempo: 0:00</p>
            <br>
            <p class="pontuacao" id="pontuacao">Pontuação: 0</p>
            <br />
            <p class="jogadas" id="jogadas">Jogadas: 0</p>
            <br />
            <p class="bombas" id="bombas">Bombas:</p>
            <br />
            <p class="barcos" id="barcos">Barcos:</p>
            <br />
            <p class="agua" id="agua">Água:</p>
            <br>
            <div class="vidas" id="vidas">

            </div>
          </div>
          <div class="div-resetar" id="div-resetar">
            <button id="btn-resetar" class="btn-resetar">RESETAR</button>
          </div>
        </section>
      </main>

      <section id="menu" class="menu">
        <div class="painel-menu" id="painel-menu">
          <button id="btnContinuar" class="btnContinuar">Continuar</button>
          <button id="btnVoltarMenu" class="btnVoltarMenu">Menu Principal</button>
        </div>
      </section>
      
      <section id="regras" class="regras">
        <div class="painel-regras" id="painel-regras">
          <h2>Como Jogar?</h2>
          <p>Clique nos blocos para descobrir o conteúdo oculto:</p>
          <ul>
            <li><strong>Barco:</strong> Você ganha 10 pontos.</li>
            <li><strong>Água:</strong> Não ganha e não perde pontos.</li>
            <li><strong>Bomba:</strong> Você perde 1 vida. Cuidado!</li>
          </ul>
          <button id="btnFecharRegras" class="btnFecharRegras">FECHAR</button>
        </div>
      </section>
    </div>
  </body>
</html>
