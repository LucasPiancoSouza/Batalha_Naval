<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batalha naval</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="pagina-container">
      <button
        id="btnAbrirMenu"
        class="botao-menu"
        type="button"
        aria-label="Abrir menu"
      >
        <img src="img/menu.png" alt="Menu" />
      </button>

      <main id="area-jogo" class="area-jogo">
        <div id="tabuleiro-jogo" class="tabuleiro-jogo"></div>
      </main>

      <section id="menu-sobreposicao" class="sobreposicao oculto" onclick="fecharMenu()">
        <div class="painel-sobreposicao">
          <button id="btnContinuar" class="botao botao-continuar" type="button">
            Continuar
          </button>
          <button id="btnVoltarMenu" class="botao botao-voltar" type="button">
            Menu Principal
          </button>
        </div>
      </section>

      <section
        id="regras-sobreposicao"
        class="sobreposicao oculto"
      >
        <div class="painel-sobreposicao painel-regras" >
          <h2>Como Jogar?</h2>
          <p>Clique nos blocos para revelar o que está escondido na frente:</p>
          <ul>
            <li><strong>Barco:</strong> Você ganha 10 pontos.</li>
            <li><strong>Água:</strong> Não ganha e não perde pontos.</li>
            <li><strong>Bomba:</strong> Você perde 1 vida. Cuidado!</li>
          </ul>
          <button id="btnFecharRegras" class="botao botao-fechar" type="button">
            Fechar
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
